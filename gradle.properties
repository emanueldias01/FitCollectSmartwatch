# Project-wide Gradle settings.
# For more details on how to configure your build, see
# http://www.gradle.org/docs/current/userguide/build_setting.html
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For example, settings in 'gradle.properties' can be overridden by
# command-line arguments.
# This file is for settings that should be used across all build environments.
# To specify settings that should be used only in a specific environment,
# like your CI server, create a file named 'gradle.properties' in that directory.

# The Gradle build system can run multiple tasks in parallel.
# This is especially useful for projects with many subprojects.
# https://docs.gradle.org/current/userguide/multi_project_builds.html#sec:parallel_execution
org.gradle.parallel=true

# The Gradle build system can use a daemon to speed up builds.
# https://docs.gradle.org/current/userguide/gradle_daemon.html
org.gradle.daemon=true

# The Gradle build system can use a cache to speed up builds.
# https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# The Kotlin compiler can use a daemon to speed up builds.
# https://kotlinlang.org/docs/gradle.html#compiler-daemon
kotlin.code.style=official

# AndroidX libraries are used by default.
android.useAndroidX=true

# Kotlin DSL can be used for build scripts.
android.nonTransitiveRClass=true

# Use AGP 8.0+ build features.
# android.defaults.buildfeatures.buildconfig=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.disallowKotlinSourceSets=false
